version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hw_postgres
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hwuser} -d ${POSTGRES_DB:-hwdb}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hw_backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-hwuser}:${POSTGRES_PASSWORD:-hwpassword}@postgres:5432/${POSTGRES_DB:-hwdb}
      
    ports:
      - '4000:4000'
    volumes:
      - ./backend/src:/src
      - ./backend/migrations:/migrations
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hw_frontend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:4000}
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
